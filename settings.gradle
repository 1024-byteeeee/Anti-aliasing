import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://jitpack.io' }
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.replaymod.preprocess') {
                useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
            }
        }
    }
}
rootProject.name = 'anti-aliasing'
def targets = new JsonSlurper().parse(file('minecraftVersions.json')).versions
targets.each { target ->
    include(":${target}")
    project(":${target}").projectDir = file("versions/${target}")
    project(":${target}").buildFileName = '../../common.gradle'
}
