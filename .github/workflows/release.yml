name: Build and upload release jars

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Build all Minecraft versions
        run: ./gradlew --no-daemon buildAndGather -x test --stacktrace

      - name: Check release jars
        shell: python
        run: |
          import json
          import pathlib
          import zipfile

          properties = dict(
              line.strip().split('=', 1)
              for line in pathlib.Path('gradle.properties').read_text().splitlines()
              if '=' in line and not line.lstrip().startswith('#')
          )
          versions = json.loads(pathlib.Path('minecraftVersions.json').read_text())['versions']
          expected = {
              f"{properties['archives_base_name']}-mc{mc}-{properties['mod_version']}.jar": mc
              for mc in versions
          }
          jars = {jar.name: jar for jar in pathlib.Path('build/libs').glob('*.jar')}
          if jars.keys() != expected.keys():
              raise SystemExit(f'Unexpected release jars: expected {list(expected)}, got {list(jars)}')
          for name, mc in expected.items():
              with zipfile.ZipFile(jars[name]) as jar:
                  metadata = json.loads(jar.read('fabric.mod.json'))
              if metadata['version'] != properties['mod_version'] or metadata['depends']['minecraft'] != mc:
                  raise SystemExit(f'Incorrect mod metadata in {name}')
          print(f'Ready to upload {len(jars)} release jars')

      - name: Upload jars to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          uploads=()
          for jar in build/libs/*.jar; do
            if grep -Fxq -- "$(basename "$jar")" <<< "$existing_assets"; then
              echo "Already uploaded: $(basename "$jar")"
            else
              uploads+=("$jar")
            fi
          done
          if ((${#uploads[@]})); then
            gh release upload "$RELEASE_TAG" "${uploads[@]}"
          fi
